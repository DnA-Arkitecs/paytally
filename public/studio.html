<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayTally Collections</title>
  <meta name="description" content="PayTally's collections dashboard in AG Studio: what was billed, what needs a decision, who owes what, and the money PayPal moved, with an assistant that runs on Claude.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314213d'/%3E%3Cpath d='M9 8v16M13 8v16M17 8v16M21 8v16M6 20l20-8' stroke='%23f2c14e' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root { --ink: #14213d; --paper: #f6f4ee; --muted: #6b7280; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .bar { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--ink); color: #f8f6f0; flex-wrap: wrap; }
    .bar a { color: #f8f6f0; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .bar svg { width: 24px; height: 24px; color: #22325a; }
    .bar .sub { color: #cbd2e1; font-size: 13px; }
    .bar .note { margin-left: auto; color: #cbd2e1; font-size: 12.5px; }
    .bar button { font: inherit; font-size: 12.5px; font-weight: 600; color: #f8f6f0; background: none; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
    #studio { flex: 1; min-height: 0; }
    .msg { margin: 40px auto; max-width: 560px; padding: 0 16px; color: var(--muted); }
    /* The "Who owes what" widget */
    .pt-owes { padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 10px; overflow: auto; height: 100%; font-size: 13px; }
    .pt-owes-head { color: var(--muted); font-size: 12.5px; }
    .pt-owes-row { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; }
    .pt-rank { color: var(--muted); font-variant-numeric: tabular-nums; }
    .pt-name { font-weight: 600; margin-bottom: 4px; }
    .pt-late { font-size: 11px; font-weight: 650; color: #b42318; background: #fdecea; border-radius: 999px; padding: 1px 7px; }
    .pt-bar { height: 8px; border-radius: 4px; background: #1f6f5c; }
    .pt-bar.late { background: #b42318; }
    .pt-owes-row b { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header class="bar">
    <a href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 8v16M13 8v16M17 8v16M21 8v16M6 20l20-8" stroke="#f2c14e" stroke-width="2.4" stroke-linecap="round"/></svg>PayTally</a>
    <span class="sub">Collections dashboard · AG Studio</span>
    <span id="note" class="note"></span>
    <button id="edit" type="button">Edit layout</button>
  </header>
  <div id="studio"><p class="msg">Loading the dashboard…</p></div>
  <script src="https://cdn.jsdelivr.net/npm/ag-studio@3.0.0/dist/umd/ag-studio.min.js"></script>
  <script src="/studio/claude-adapter.js"></script>
  <script src="/studio/owes-scoreboard.js"></script>
  <script src="/studio/app.js"></script>
</body>
</html>
